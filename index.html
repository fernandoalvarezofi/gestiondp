    <meta name="twitter:card" content="summary_large_image" />

  <body>
    <!-- Pantalla de carga instantánea: se ve mientras baja el JavaScript; React la reemplaza al montar. -->
    <style>
      #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#f6f6f8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
      #boot svg{width:64px;height:64px;animation:bootpulse 1.2s ease-in-out infinite}
      #boot span{font-weight:900;font-size:26px;letter-spacing:-.04em;color:#111}
      @keyframes bootpulse{50%{transform:scale(.92);opacity:.85}}
      @media (prefers-reduced-motion:reduce){#boot svg{animation:none}}
    </style>
    <div id="root"><div id="boot" role="status" aria-label="Cargando Woref"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#141414"/><path d="M32 9.5c-10.2 0-18.2 8-18.2 18 0 13 15.4 25.7 16.9 26.9a2 2 0 0 0 2.6 0c1.5-1.2 16.9-13.9 16.9-26.9 0-10-8-18-18.2-18Z" fill="#fff"/><path d="M21.5 22.5 25.6 34a1.4 1.4 0 0 0 2.6 0L32 24.6 35.8 34a1.4 1.4 0 0 0 2.6 0l4.1-11.5" fill="none" stroke="#F0B900" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>woref</span></div></div>
    <script>
      // En las tiendas de cada comercio (/t/...) no se muestra la marca Woref, y en modo oscuro el fondo acompaña.
      (function () { var b = document.getElementById("boot"); if (!b) return; try { if (localStorage.getItem("theme") === "dark") { b.style.background = "#111316"; b.lastChild.style.color = "#f2f2f2"; } } catch (e) {} if (location.pathname.indexOf("/t/") === 0) b.innerHTML = ""; })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
